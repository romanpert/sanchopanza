[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sanchopanza"          # `sancho` en PyPI es de otro; se instala y se importa como `sanchopanza`
version = "0.3.0"
description = "A calibrated, non-generative decision layer (a squire) for LLM agent harnesses."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Roman Perez", email = "roman.p98@gmail.com" }]
keywords = [
  "agents", "llm", "routing", "calibration", "prompt-injection", "citation-verification",
  "system-one", "typesafe", "jev", "mcp", "claude-code", "harness",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
jev = ["httpx>=0.27"]
llm = ["httpx>=0.27"]
mcp = ["mcp>=1.2"]
langchain = ["langchain>=1.3"]
all = ["httpx>=0.27", "mcp>=1.2", "langchain>=1.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
sanchopanza = "sanchopanza.cli:main"

[project.entry-points."sanchopanza.providers"]
jev = "sanchopanza.providers.jev:JevDecider"
recorded = "sanchopanza.providers.recorded:RecordedDecider"
null = "sanchopanza.providers.null:NullDecider"
llm = "sanchopanza.providers.llm:LLMDecider"

[project.urls]
Homepage = "https://github.com/romanpert/sanchopanza"
Documentation = "https://github.com/romanpert/sanchopanza/tree/main/docs"
Paper = "https://github.com/romanpert/sanchopanza/blob/main/docs/paper.md"

[tool.hatch.build.targets.wheel]
packages = ["src/sanchopanza"]

[tool.hatch.build.targets.sdist]
include = [
  "src/sanchopanza",
  "benches",
  "fixtures",
  "benchmarks",
  "skills",
  "docs",
  "README.md",
  "LICENSE",
  "NOTICE",
  "THIRD_PARTY_NOTICES",
]
# A PyPI upload cannot be withdrawn. Session handoffs carry local paths and commands that read
# another project's .env; raw agent transcripts carry thinking-block signatures. Neither ships.
# tests/test_packaging.py pins this list.
exclude = [
  "docs/HANDOFF-*.md",
  "docs/results/**/runs/",
  "docs/results/**/runs-*/",
  "benchmarks/**/runs/",  # where benchmarks/agentdojo/run.py logs by default
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
