name: Release

# Publica en PyPI al empujar un tag v*.*.*, con Trusted Publisher (OIDC): sin tokens.
# Mismo patron que romanpert/mcp-aemps, con hatchling en vez de poetry.
#
# Endurecido el 2026-09-25: cada accion va fijada a un commit (el comentario dice que version
# es), el token del flujo solo lee por defecto y cada trabajo pide lo que necesita y nada
# mas, y el checkout no deja credenciales en el disco. El Trusted Publisher de PyPI esta
# atado a este fichero (release.yml) y al entorno `pypi`: no renombrar ninguno de los dos.
# Para subir una accion: git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>
# (el commit pelado `^{}` si la etiqueta es anotada).

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build

      - name: Verify the tag matches the version in pyproject
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$TAG" != "$VER" ]; then
            echo "Tag $TAG does not match pyproject version $VER" >&2
            exit 1
          fi

      # Nada se publica sin pasar por lo mismo que la CI: nadie sube un paquete roto.
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q
      - name: Replay the public benches from the recorded fixture
        run: sanchopanza bench benches/core.jsonl benches/safety.jsonl benches/graph.jsonl --provider recorded --fixture fixtures/public-benches.jsonl

      - run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI (Trusted Publisher / OIDC)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sanchopanza/
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1)

  github-release:
    name: GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the files
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
